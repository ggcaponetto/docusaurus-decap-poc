# This file now lives inside the site folder (my-website/) rather than the
# repo root. Netlify only looks here if the site's "Base directory" is set to
# `my-website` in the Netlify UI (Site configuration -> Build & deploy ->
# Build settings). Without that, Netlify looks for netlify.toml at the repo
# root, finds nothing, and builds from the wrong directory.
[build]
  base = "my-website"
  command = "npm run build"
  functions = "netlify/functions"
  publish = "build"

  ## Uncomment to use this redirect for Single Page Applications like create-react-app.
  ## Not needed for static site generators.
  #[[redirects]]
  #  from = "/*"
  #  to = "/index.html"
  #  status = 200

  ## (optional) Settings for Netlify Dev
  ## https://github.com/netlify/cli/blob/main/docs/netlify-dev.md#project-detection
  #[dev]
  #  command = "npm start" # Command to start your dev server
  #  port = 3000 # Port that the dev server will be listening on
  #  publish = "build" # Folder with the static content

  ## more info on configuring this file: https://ntl.fyi/file-based-build-config
